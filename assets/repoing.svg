<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="repo.ing: the market layer for open source. Launch a market for any public GitHub repo. Every trade pays the builders.">
  <title>repo.ing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1430"/><stop offset="1" stop-color="#0b0a17"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a59" stop-opacity="0.34"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="600" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    .line { stroke-dasharray: 720; animation: draw 6s ease-in-out infinite; }
    .tip { animation: pulse 2s ease-in-out infinite; transform-origin: 560px 142px; }
    @keyframes draw { 0% { stroke-dashoffset: 720; } 45%, 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(2.1); opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="360" fill="url(#bg)"/>
    <path d="M40,300 L96,286 L150,292 L204,262 L258,270 L312,232 L366,240 L420,196 L474,206 L528,158 L560,142 L560,360 L40,360 Z" fill="url(#fill)"/>
    <path class="line" d="M40,300 L96,286 L150,292 L204,262 L258,270 L312,232 L366,240 L420,196 L474,206 L528,158 L560,142" fill="none" stroke="#ff7a59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="96" cy="286" r="3.5" fill="#f6f1e7"/><circle cx="204" cy="262" r="3.5" fill="#f6f1e7"/><circle cx="312" cy="232" r="3.5" fill="#f6f1e7"/><circle cx="420" cy="196" r="3.5" fill="#f6f1e7"/><circle cx="528" cy="158" r="3.5" fill="#f6f1e7"/>
    <circle class="tip" cx="560" cy="142" r="6" fill="#ff7a59"/>
    <circle cx="560" cy="142" r="5" fill="#f6f1e7"/>
    <text x="40" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f6f1e7" letter-spacing="-1.6">repo.ing</text>
    <text x="40" y="110" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ff7a59">The market layer for open source.</text>
    <text x="40" y="144" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#f6f1e7" fill-opacity="0.78">Launch a market for any public GitHub repo.</text>
<text x="40" y="169" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#f6f1e7" fill-opacity="0.78">Every trade pays the builders.</text>
    <text x="40" y="332" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a9a4c2">repo.ing</text>
    <text x="560" y="332" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a9a4c2">live on Solana</text>
  </g>
  <rect x="0.5" y="0.5" width="599" height="359" rx="17.5" fill="none" stroke="#2b2545"/>
</svg>
