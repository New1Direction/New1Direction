<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="54" viewBox="0 0 1200 54" role="img" aria-label="No windows lit yet. Be the first to light one.">
  <title>Windows lit by visitors</title>
  <defs><clipPath id="c"><rect x="44" width="1140" height="54"/></clipPath></defs>
  <style>
    .run { animation: scroll 24s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="53" rx="26.5" fill="#e6dfd0" fill-opacity="0.55" stroke="#cfc7b4"/>
  <circle class="dot" cx="26" cy="27" r="5" fill="#e2553a"/>
  <g clip-path="url(#c)"><g class="run">
    <g transform="translate(56 0)"><text x="0" y="33" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#2a2440" fill-opacity="0.9">No windows lit yet. Be the first to light one.</text></g>
    <g transform="translate(1256 0)"><text x="0" y="33" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#2a2440" fill-opacity="0.9">No windows lit yet. Be the first to light one.</text></g>
  </g></g>
</svg>
