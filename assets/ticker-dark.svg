<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" role="img" aria-label="No windows lit yet. Be the first to light one.">
  <title>Windows lit by visitors</title>
  <defs><clipPath id="c"><rect x="44" width="1140" height="46"/></clipPath></defs>
  <style>
    .run { animation: scroll 21s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="45" rx="22.5" fill="#1c1733" fill-opacity="0.55" stroke="#2b2545"/>
  <circle class="dot" cx="24" cy="23" r="5" fill="#ff7a59"/>
  <g clip-path="url(#c)"><g class="run">
    <g transform="translate(52 0)"><text y="29" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f6f1e7" fill-opacity="0.9">No windows lit yet. Be the first to light one.</text></g>
    <g transform="translate(1252 0)"><text y="29" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f6f1e7" fill-opacity="0.9">No windows lit yet. Be the first to light one.</text></g>
  </g></g>
</svg>
